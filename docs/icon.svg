<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Source of assets/icon.png. Render it with macOS sips, as the README's Development section shows. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FD3E0"/>
      <stop offset="0.55" stop-color="#5E9FB8"/>
      <stop offset="1" stop-color="#2F6382"/>
    </linearGradient>
    <linearGradient id="bar" x1="56" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CC3CC"/>
      <stop offset="1" stop-color="#8FDB8F"/>
    </linearGradient>
  </defs>

  <!-- A daytime landscape, the screensaver photo the card floats over. -->
  <rect width="256" height="256" fill="url(#sky)"/>
  <path d="M0 182 L54 140 L92 166 L142 118 L196 160 L230 138 L256 152 L256 256 L0 256 Z" fill="#2B5671"/>
  <path d="M0 214 L40 190 L86 210 L134 178 L184 206 L226 186 L256 198 L256 256 L0 256 Z" fill="#1F4259"/>

  <!-- The live activity card: dark glass with a hairline edge. -->
  <rect x="36" y="48" width="184" height="160" rx="22" fill="#14202C" fill-opacity="0.62"/>
  <rect x="36.5" y="48.5" width="183" height="159" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <!-- Heading on the left, the green Live dot on the right. -->
  <rect x="56" y="66" width="52" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.45"/>
  <rect x="164" y="66" width="22" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="197" cy="69.5" r="5" fill="#7EDC8A"/>

  <!-- Activity icon, title and status; the value and its label on the right. -->
  <circle cx="70" cy="108" r="15" fill="#5CC3CC"/>
  <circle cx="70" cy="108" r="7" fill="none" stroke="#14202C" stroke-width="3.5"/>
  <rect x="96" y="97" width="62" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="96" y="113" width="42" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="168" y="96" width="32" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="178" y="113" width="22" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.55"/>

  <!-- Progress: the track, and the part done. -->
  <rect x="56" y="136" width="144" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.18"/>
  <rect x="56" y="136" width="92" height="9" rx="4.5" fill="url(#bar)"/>

  <!-- Two control buttons. -->
  <rect x="56" y="160" width="68" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="132" y="160" width="68" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="73" y="170" width="8" height="8" rx="1.5" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="86" y="171" width="24" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.7"/>
  <path d="M150 168 L150 180 L159 174 Z" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="164" y="171" width="24" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>
